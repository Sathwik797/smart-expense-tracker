spring.application.name=expense-tracker

# Database configuration (H2 in-memory default for zero-setup execution; MySQL configurable via environment variables)
spring.datasource.url=${DB_URL:jdbc:h2:mem:expensedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# JPA settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Spring Boot Actuator settings (Expose only health and info)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# H2 Console (disabled by default)
spring.h2.console.enabled=false